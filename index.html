<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="theme-color" content="#F6F5F1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<title>Folio Planners</title>
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:grid;gap:10px;box-shadow:var(--shadow)}
.login-brand{font-size:30px;font-weight:700;letter-spacing:-.02em}
.login .l{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:4px}
.login .btn{justify-content:center;padding:11px 14px}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --sunk:#EFEDE7; --ink:#1C1C1E; --ink-2:#6E6E73; --line:#E4E1D9; --line-2:#D6D2C8;
  --accent:#2F5BD3; --accent-soft:#E7EDFB; --danger:#D23B30;
  --sand:#E8E5DA; --sky:#DAE2EA; --sage:#DCE6D7; --rose:#F1DEDB; --lilac:#E4DEEF; --butter:#F2E9C9;
  --n-yellow:#FFF7D1; --n-yellow-b:#F0D878; --n-pink:#FCE3E6; --n-pink-b:#F0B3BD; --n-green:#E1F3E4; --n-green-b:#9FD2AB; --n-blue:#E2ECFB; --n-blue-b:#A9C3EE; --n-lilac:#EEE6FA; --n-lilac-b:#C6B3EA;
  --i-ink:#1C1C1E; --i-blue:#2F5BD3; --i-red:#D23B30; --i-green:#2E8B57; --i-orange:#E07B17; --i-hy:#FFE14D; --i-hp:#FF8FC7; --i-hg:#7FE39A;
  --dot:#D8D4CA; --shadow:0 1px 2px rgba(30,28,20,.06),0 10px 30px -18px rgba(30,28,20,.35);
  --f:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131315; --surface:#1D1E21; --sunk:#26272B; --ink:#EDEDEF; --ink-2:#9C9CA3; --line:#2E2F34; --line-2:#3A3B41;
    --accent:#8AA6FF; --accent-soft:#232C47; --danger:#FF7B6E;
    --sand:#2A2823; --sky:#212A33; --sage:#222B22; --rose:#302423; --lilac:#29253A; --butter:#2F2A1B;
    --n-yellow:#3A3419; --n-yellow-b:#6B5C1E; --n-pink:#3A2429; --n-pink-b:#6C3A45; --n-green:#1F3326; --n-green-b:#335C40; --n-blue:#1E2A3D; --n-blue-b:#34507A; --n-lilac:#2C2440; --n-lilac-b:#524073;
    --i-ink:#EDEDEF; --i-blue:#8AA6FF; --i-red:#FF7B6E; --i-green:#6FD39A; --i-orange:#FFB35C; --i-hy:#E8C62E; --i-hp:#E86BAA; --i-hg:#4FC46E;
    --dot:#393A40; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131315; --surface:#1D1E21; --sunk:#26272B; --ink:#EDEDEF; --ink-2:#9C9CA3; --line:#2E2F34; --line-2:#3A3B41;
  --accent:#8AA6FF; --accent-soft:#232C47; --danger:#FF7B6E;
  --sand:#2A2823; --sky:#212A33; --sage:#222B22; --rose:#302423; --lilac:#29253A; --butter:#2F2A1B;
  --n-yellow:#3A3419; --n-yellow-b:#6B5C1E; --n-pink:#3A2429; --n-pink-b:#6C3A45; --n-green:#1F3326; --n-green-b:#335C40; --n-blue:#1E2A3D; --n-blue-b:#34507A; --n-lilac:#2C2440; --n-lilac-b:#524073;
  --i-ink:#EDEDEF; --i-blue:#8AA6FF; --i-red:#FF7B6E; --i-green:#6FD39A; --i-orange:#FFB35C; --i-hy:#E8C62E; --i-hp:#E86BAA; --i-hg:#4FC46E;
  --dot:#393A40; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{min-height:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;line-height:1.2;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--line-2);background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn:disabled{opacity:.4;cursor:default}
.btn .pl{font-size:19px;line-height:1;font-weight:400;margin-top:-2px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;font-weight:500}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.stk{display:inline-block}
.stk svg{width:100%;height:100%;display:block}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#34A26A}
.status.saving::before{background:#E8B92E}
.status.error{color:var(--danger);white-space:normal} .status.error::before{background:var(--danger)}
.muted{color:var(--ink-2)}
.credit{font-size:12px;color:var(--ink-2)} .credit a{color:inherit}

/* ---------- Shelf ---------- */
.shelf-wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.shelf-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.shelf-top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;margin-right:auto}
.shelf-top .search{width:min(260px,100%)}
.folderbar{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.folderbar .chips{flex:0 1 auto;min-width:0}
.chip.fchip{display:inline-flex;align-items:center;gap:7px}
.chip .fdot{width:10px;height:10px;border-radius:50%;background:var(--fc);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip.fchip[aria-pressed="true"]{background:var(--fc);border-color:var(--fc);color:var(--fci)}
.chip.fchip[aria-pressed="true"] .fdot{background:var(--fci);opacity:.55;box-shadow:none}
.addfold{flex:none;width:34px;height:34px;border-radius:50%;border:1px dashed var(--line-2);background:transparent;font-size:20px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.addfold:hover{border-style:solid;border-color:var(--ink-2);color:var(--ink);background:var(--surface)}
.fpanel{padding:10px;display:grid;gap:10px;width:260px;max-width:100%}
.fpanel .lab{padding:0}
.fcolors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.fcolors .sw{width:30px;height:30px}
.fprev{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.pcard .fbadge{display:inline-flex;align-items:center;gap:6px}
.pcard .fbadge i{width:8px;height:8px;border-radius:50%;background:var(--fc);box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 20px}
.cardwrap{display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.pcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;border:0;border-radius:22px;padding:22px 22px 20px;min-height:250px;text-align:left;background:var(--tint,var(--sand));transition:transform .15s ease, box-shadow .15s ease;width:100%}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard .ic{width:44px;height:44px}
.pcard .t{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.pcard .f{color:var(--ink-2);margin-top:4px;font-size:14px}
.cardwrap .meta{display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:var(--ink-2);font-size:14px}
.cardwrap .more{border:0;background:transparent;border-radius:8px;padding:2px 8px;color:var(--ink-2);font-size:18px;line-height:1}
.cardwrap .more:hover{background:var(--sunk)}
.newcard{border:2px dashed var(--line-2);border-radius:22px;min-height:250px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-2);font-weight:500;font-size:16px}
.newcard .plus{width:58px;height:58px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:30px;color:var(--ink);font-weight:300}
.newcard:hover{border-color:var(--ink-2);color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface);color:var(--ink-2);margin-top:8px}
.menu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:200px;max-width:calc(100vw - 32px)}
.menu .mi{border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;display:flex;gap:10px;align-items:center}
.menu .mi:hover{background:var(--sunk)}
.menu .mi.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .lab{font-size:12px;color:var(--ink-2);padding:6px 10px 2px}
.menu .rowx{display:flex;gap:6px;padding:4px 10px 8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.empty{grid-column:1/-1;color:var(--ink-2);padding:30px 4px}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,15,18,.4);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.sheet{background:var(--bg);border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 20px}
.sheet-head h2{font-size:21px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.sheet-body{padding:4px 20px 24px;overflow:auto}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choice{border:0;border-radius:22px;padding:24px;text-align:left;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;background:var(--tint);transition:transform .15s}
.choice:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.choice b{font-size:20px;display:block;margin-bottom:4px}
.choice .ic{width:46px;height:46px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.tplgrid .pcard{min-height:190px}
.tplgrid .pcard .f{font-size:13px}
.form{display:grid;gap:18px;max-width:560px}
.form .l{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.iconrow{display:flex;flex-wrap:wrap;gap:6px}
.iconpick{border:2px solid transparent;background:var(--surface);border-radius:12px;width:48px;height:48px;padding:7px}
.iconpick[aria-pressed="true"]{border-color:var(--accent)}
@media (max-width:700px){
  .shelf-wrap{padding:18px 16px 80px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .pcard,.newcard{min-height:190px;padding:16px;border-radius:18px}
  .pcard .t{font-size:17px}
  .scrim{padding:0;align-items:stretch}
  .sheet{border-radius:0;height:100%}
  .choices{grid-template-columns:minmax(0,1fr)}
  .tplgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}

/* ---------- Editor ---------- */
.ed{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.top .iconbtn{border:0;background:transparent;border-radius:10px;width:40px;height:40px;padding:6px;flex:none}
.top .iconbtn:hover{background:var(--sunk)}
.top .iconbtn .stk{width:100%;height:100%}
.top .ttl{font-size:18px;font-weight:700;border:1px solid transparent;background:var(--surface);border-radius:12px;padding:7px 14px;min-width:0;flex:0 1 380px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.top .ttl:focus{outline:none;border-color:var(--accent)}
.top select{border:0;background:transparent;color:var(--ink-2);padding:6px;border-radius:8px;max-width:150px}
.top select:hover{background:var(--sunk)}
.spacer{flex:1}
.ed-body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}
.pages{padding:22px 12px;overflow:auto;border-right:1px solid var(--line)}
.pages-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 10px}
.pages-head span{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.plist{display:flex;flex-direction:column;gap:2px}
.pitem{display:flex;align-items:center;border-radius:12px;flex:none}
.pitem button.pn{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem:hover{background:var(--sunk)}
.pitem.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pitem .pm{border:0;background:transparent;opacity:0;padding:4px 8px;border-radius:8px;color:var(--ink-2)}
.pitem:hover .pm,.pitem.on .pm,.pitem .pm:focus-visible{opacity:1}
.main{overflow:auto;min-height:0;padding:22px 28px 120px}
.pagecol{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pname{font-size:17px;font-weight:500;border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:11px 18px;width:100%}
.pname:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.toolbar{position:sticky;top:-22px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;background:var(--bg)}
.toolbar .btn{border-radius:12px;padding:9px 14px}
.toolbar .btn .stk{width:20px;height:20px}
.toolbar .draw{margin-left:auto}
.paper{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:40px 48px 60px 64px;min-height:560px}
.blocks{display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.blk{position:relative;display:flex;gap:6px;align-items:flex-start;margin-left:-40px}
.handle{flex:none;width:30px;height:30px;margin-top:2px;border:0;background:transparent;border-radius:8px;color:var(--ink-2);opacity:.45;cursor:grab;touch-action:none;display:grid;place-items:center}
.handle svg{width:14px;height:14px}
.blk:hover .handle,.blk:focus-within .handle{opacity:1}
.handle:hover{background:var(--sunk)}
.bbody{flex:1;min-width:0}
.blk.dragging{opacity:.4}
.dropline{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--accent);z-index:5;pointer-events:none}
.addhint{border:0;background:transparent;color:var(--ink-2);text-align:left;padding:8px 0 0;opacity:.7;align-self:flex-start}
.addhint:hover{opacity:1}
[contenteditable]{outline:none;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;border-radius:4px}
[data-ph]:empty::before{content:attr(data-ph);color:var(--ink-2);opacity:.6;pointer-events:none}
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.h2{font-size:21px;font-weight:600;line-height:1.3}
.txt{line-height:1.6;min-height:1.6em}
.lt{font-weight:600;margin-bottom:6px}
.ck{display:flex;align-items:flex-start;gap:12px;padding:4px 0}
.li{display:flex;align-items:flex-start;gap:10px;padding:3px 0}
.ck,.li{position:relative}
.rgrip{position:absolute;left:-24px;top:2px;width:20px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--ink-2);opacity:0;cursor:grab;touch-action:none;display:grid;place-items:center}
.rgrip svg{width:11px;height:11px}
.ck:hover .rgrip,.li:hover .rgrip,.tg .rg:hover .rgrip,.tg .rg.hl .rgrip,.hn:hover .rgrip,.rgrip:focus-visible{opacity:.8}
.rgrip:hover{background:var(--sunk);opacity:1}
@media (hover:none){.rgrip{opacity:.4}}
.tg>div.rg{padding:0;display:grid;place-items:center;min-height:40px}
.tg .rg .rgrip{position:static;opacity:.45}
.hg .hn .rgrip{position:static;flex:none;margin-left:-4px}
.rowdrag{opacity:.35}
.rowline{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--acc,var(--accent));pointer-events:none;z-index:4}
.bbody{position:relative}
.li .lm{flex:none;min-width:22px;text-align:right;color:var(--acc,var(--accent));font-weight:700;font-variant-numeric:tabular-nums;line-height:inherit;user-select:none}
.li .lm.sym{text-align:center;font-weight:400}
.li .lm.ldot{align-self:stretch;display:flex;justify-content:center;align-items:flex-start;font-size:inherit}
.li .lm.ldot::before{content:"";display:block;width:7px;height:7px;min-width:7px;min-height:7px;aspect-ratio:1;margin-top:calc(.75em - 3.5px);border-radius:50%;background:currentColor;flex:0 0 7px}
.li .ct{flex:1;min-width:0}
.mk{min-width:44px;font-weight:700}
.cb{flex:none;width:22px;height:22px;border:1.5px solid var(--ink-2);border-radius:6px;background:transparent;padding:0;margin-top:1px;position:relative}
.cb.on{background:var(--ink);border-color:var(--ink)}
.cb.on::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(40deg)}
.ck .ct{flex:1;min-width:0}
.ck.done .ct{text-decoration:line-through;color:var(--ink-2)}
.x{border:0;background:transparent;color:var(--ink-2);width:26px;height:26px;border-radius:6px;opacity:.55;flex:none;font-size:18px;line-height:1}
.x:hover{opacity:1;background:var(--sunk)}
.addi{border:0;background:transparent;color:var(--ink-2);padding:6px 0;display:flex;gap:10px;align-items:center}
.addi:hover{color:var(--ink)}
.note{border:1.5px solid var(--nb);background:var(--nc);border-radius:16px;padding:16px 20px;min-height:84px;font-family:var(--hand);font-size:24px;line-height:1.3}
.tbl{overflow-x:auto}
.tg{display:grid;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;min-width:420px}
.tg>div{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:40px}
.tg>div.lc{border-right:0}
.tg>.th{background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink-2)}
.hab{overflow-x:auto}
.hg{display:grid;align-items:center;row-gap:6px;column-gap:4px}
.hg .dh{font-size:11px;font-weight:600;color:var(--ink-2);text-align:center}
.hg .hn{display:flex;align-items:center;gap:4px;padding-right:8px;min-width:0}
.hg .hn [contenteditable]{flex:1;min-width:0}

/* ============ Storage: your account (db capability), browser as fallback ============ */
const Store = {
  mode:'local', base:null, col:null, timers:{}, chains:{}, inkTimers:{}, metaTimer:null,
  async init(){
    if (window.FolioBackend){
      try{ const r = await window.FolioBackend.connect(); if (r){ Object.assign(this, r); this.mode = 'cloud'; this.hosted = true; } }
      catch(e){ this.mode = 'local'; this.backendError = (e && e.message) || String(e); }
      return;
    }
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try{
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.base = db.doc('data/users/'+id+'/app');
      this.col = this.base.collection('planners');
      this.mode = 'cloud';
      try{ this.assets = await c.use('assets'); }catch(e){ this.assets = null; }
    }catch(e){ this.mode = 'local'; }
  },
  lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} },
  async load(){
    if (this.mode==='cloud'){
      try{
        const [m, list] = await Promise.all([this.base.get(), this.col.get()]);
        return {meta: m.exists ? clone(m.data()) : null, planners: list.docs.filter(d => d.exists).map(d => clone(d.data()))};
      }catch(e){ this.mode = 'local'; this.backendError = 'couldn’t reach your account, so changes are kept in this browser for now.'; }
    }
    return {meta:this.lsGet('folio.meta'), planners:Object.values(this.lsGet('folio.planners')||{})};
  },
  chain(key, fn){
    this.chains[key] = (this.chains[key]||Promise.resolve()).then(fn).then(() => setStatus('saved')).catch(e => setStatus('error', e));
  },
  localPlanners(){ const o = {}; for (const [id,p] of S.planners) o[id] = p; if (!this.lsSet('folio.planners', o)) throw {message:'browser storage is full or blocked'}; },
  savePlanner(p, now){
    clearTimeout(this.timers[p.id]); setStatus('saving');
    const run = () => { delete this.timers[p.id]; const pl = S.planners.get(p.id); if (!pl) return; const body = clone(pl);
      if (JSON.stringify(body).length > 250000) return setStatus('error', {message:'this planner is too big — split it into two'});
      this.chain(p.id, () => this.mode==='cloud' ? this.col.doc(p.id).set(body) : this.localPlanners()); };
    if (now) run(); else this.timers[p.id] = setTimeout(run, 600);
  },
  deletePlanner(p){
    clearTimeout(this.timers[p.id]); delete this.timers[p.id];
    this.chain(p.id, async () => {
      if (this.mode==='cloud'){ await this.col.doc(p.id).delete(); for (const pg of p.pages||[]) if (pg.id) await this.col.doc(p.id).collection('ink').doc(pg.id).delete(); }
      else { this.localPlanners(); (p.pages||[]).forEach(pg => this.lsDel('folio.ink.'+pg.id)); }
    });
  },
  saveMeta(){
    clearTimeout(this.metaTimer); setStatus('saving');
    this.metaTimer = setTimeout(() => { const body = clone(S.meta);
      this.chain('__meta', () => this.mode==='cloud' ? this.base.set(body) : (this.lsSet('folio.meta', body) ? null : Promise.reject({message:'browser storage is blocked'}))); }, 250);
  },
  async loadInk(pid, pgid){
    if (this.mode==='cloud'){ try{ const s = await this.col.doc(pid).collection('ink').doc(pgid).get(); return s.exists ? clone(s.data()) : null; }catch(e){ return null; } }
    return this.lsGet('folio.ink.'+pgid);
  },
  saveInk(pid, pgid, data){
    clearTimeout(this.inkTimers[pgid]); setStatus('saving');
    this.inkTimers[pgid] = setTimeout(() => {

      const body = clone(data);

      this.chain('ink'+pgid, () => this.mode==='cloud' ? this.col.doc(pid).collection('ink').doc(pgid).set(body) : (this.lsSet('folio.ink.'+pgid, body) ? null : Promise.reject({message:'browser storage is full'})));
    }, 700);
  },
  deleteInk(pid, pgid){ this.chain('ink'+pgid, () => this.mode==='cloud' ? this.col.doc(pid).collection('ink').doc(pgid).delete() : this.lsDel('folio.ink.'+pgid)); },
  flush(){ for (const id of Object.keys(this.timers)){ clearTimeout(this.timers[id]); delete this.timers[id]; this.savePlanner({id}, true); } }
};

function migrate(p){
  if (p.v === 2) return p;
  const noteKey = c => ({'#FFC9C4':'pink','#C6EDD5':'green','#CDE1FF':'blue','#E4D6FF':'lilac'})[c] || 'yellow';
  const f = 1000/600;
  const pages = (p.pages||[]).map((pg, i) => {
    const blocks = [], deco = [];
    for (const el of [...(pg.els||[])].sort((a,b) => (a.y-b.y) || (a.x-b.x))){
      const q = el.props || {};
      switch (el.type){
        case 'sticker': deco.push({id:uid(), kind:'sticker', name:q.name, x:el.x*f, y:el.y*f, w:el.w*f, r:el.rot||0}); break;
        case 'tape': deco.push({id:uid(), kind:'tape', color:q.color, pattern:q.pattern, x:el.x*f, y:el.y*f, w:el.w*f, h:el.h*f, r:el.rot||0}); break;
        case 'heading': blocks.push({id:uid(), type:'heading', text:tokens(q.text, pg.date), size:(q.size||30) >= 26 ? 'h1' : 'h2'}); break;
        case 'text': blocks.push({id:uid(), type:'text', text:q.text||''}); break;
        case 'note': blocks.push({id:uid(), type:'note', text:tokens(q.text, pg.date), color:noteKey(q.color)}); break;
        case 'checklist': blocks.push({id:uid(), type:'checklist', title:q.title, items:(q.items||[]).map(x => ({t:x.t, d:x.d?1:0}))}); break;
        case 'table': blocks.push({id:uid(), type:'table', cols:q.cols, rows:q.rows}); break;
        case 'habits': blocks.push({id:uid(), type:'habit', title:'Habits', days:q.days===7 ? 7 : 31, rows:(q.habits||[]).map(x => ({n:x.n, d:x.d||[]}))}); break;
        case 'tracker': blocks.push({id:uid(), type:'counter', label:q.label, count:q.count, filled:q.filled, icon:q.icon}); break;
        case 'mood': blocks.push({id:uid(), type:'mood', label:q.label, pick:q.pick}); break;
        case 'week': blocks.push({id:uid(), type:'week', cells:q.cells||[]}); break;
        case 'divider': blocks.push({id:uid(), type:'divider'}); break;
      }
    }
    return {id:pg.id||uid(), name:'Page '+(i+1), date:pg.date||ymd(new Date()), blocks, deco};
  });
  const firstSticker = pages[0]?.deco.find(d => d.kind==='sticker');
  return {id:p.id, v:2, title:p.title||'Planner', icon:firstSticker?.name||'notebook', look:{...DEFAULT_LOOK}, folder:p.folder||null, pages, isTemplate:p.isTemplate, createdAt:p.createdAt, updatedAt:p.updatedAt};
}

/* ============ Undo / redo for the open planner (Ctrl/⌘+Z, Ctrl/⌘+Shift+Z) ============ */
// Every change is grouped: a burst of edits (typing a word, dragging a sticker) becomes one step.
const HIST_FIELDS = ['title','icon','folder','look','pages'];
const Hist = {
  stack:[], redo:[], last:null, timer:null, restoring:false,
  snap(){
    const p = cur(); if (!p) return null;
    const o = {}; for (const k of HIST_FIELDS) o[k] = p[k];
    o.ink = {}; for (const pg of p.pages) if (S.ink.has(pg.id)) o.ink[pg.id] = S.ink.get(pg.id);
    return JSON.stringify(o);
  },
  reset(){ clearTimeout(this.timer); this.stack = []; this.redo = []; this.last = this.snap(); this.paint(); },
  note(){ if (this.restoring || !this.last) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.commit(), 450); },
  commit(){
    clearTimeout(this.timer); this.timer = null;
    const now = this.snap(); if (!now || now === this.last) return;
    this.stack.push(this.last); if (this.stack.length > 100) this.stack.shift();
    this.redo = []; this.last = now; this.paint();
  },
  // A page's drawing loads after the planner opens; add it to older steps so undo never erases it.
  addInk(pgid, ink){
    const fix = str => { if (!str) return str; const o = JSON.parse(str); if (!(pgid in o.ink)){ o.ink[pgid] = ink; return JSON.stringify(o); } return str; };
    this.last = fix(this.last); this.stack = this.stack.map(fix); this.redo = this.redo.map(fix);
  },
  undo(){ this.commit(); if (!this.stack.length){ toast('Nothing to undo.'); return; } this.redo.push(this.last); this.apply(this.stack.pop()); },
  redoStep(){ this.commit(); if (!this.redo.length){ toast('Nothing to redo.'); return; } this.stack.push(this.last); this.apply(this.redo.pop()); },
  apply(str){
    const p = cur(); if (!p) return;
    const o = JSON.parse(str), before = JSON.parse(this.snap());
    this.restoring = true;
    for (const k of HIST_FIELDS){ if (o[k] === undefined) delete p[k]; else p[k] = o[k]; }
    for (const id in o.ink){ if (JSON.stringify(o.ink[id]) !== JSON.stringify(before.ink[id])){ S.ink.set(id, o.ink[id]); Store.saveInk(p.id, id, o.ink[id]); } }
    p.updatedAt = Date.now(); Store.savePlanner(p);
    this.last = str; this.restoring = false;
    if (!p.pages.some(pg => pg.id===S.pageId)) S.pageId = p.pages[0].id;
    setDraw(false, true); closePicker(); closeMenu(); S.selDeco = null;
    renderEditor(); this.paint();
  },
  paint(){
    const u = $('#undoBtn'), r = $('#redoBtn');
    if (u) u.disabled = !this.stack.length && !this.timer;
    if (r) r.disabled = !this.redo.length;
  }
};
document.addEventListener('keydown', e => {

  const k = e.key.toLowerCase();

  if (e.target.closest && e.target.closest('.menu, .picker')) return;

function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function exportBackup(){
  toast('Preparing backup…');
  try{
    Store.flush();
    const planners = [...S.planners.values()].map(clone), ink = {}, images = {};
    for (const p of planners){
      for (const pg of p.pages){
        const d = S.ink.get(pg.id) || await Store.loadInk(p.id, pg.id);
        if (d && ((d.overlay||[]).length || Object.keys(d.blocks||{}).length)) ink[pg.id] = d;
        for (const dc of pg.deco || []) if (dc.kind==='image' && dc.asset && !images[dc.asset]){
          try{ const r = await fetch(picSrc(dc)); if (r.ok) images[dc.asset] = await blobToDataURL(await r.blob()); }catch(e){}
        }
      }
    }
    const json = JSON.stringify({folio:1, exportedAt:new Date().toISOString(), meta:S.meta, planners, ink, images});
    const name = 'folio-backup-' + ymd(new Date()) + '.json';
    const dl = window.claude && typeof window.claude.use==='function' ? await window.claude.use('downloads') : null;
    if (dl){
      try{ await dl.save({filename:name, data:new Blob([json], {type:'application/json'})}); toast('Backup saved: ' + planners.length + ' planners.'); }
      catch(e){ if (e && e.code!=='declined') toast('Couldn’t save the backup here.'); }
    } else {
      const a = h('a', {href:URL.createObjectURL(new Blob([json], {type:'application/json'})), download:name});
      document.body.append(a); a.click(); a.remove();
      toast('Backup saved: ' + planners.length + ' planners.');
    }
  }catch(e){ toast('Couldn’t make the backup. Try again.'); }
}
async function importBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast('That file isn’t a Folio backup.'); return; }
  if (!data || data.folio!==1 || !Array.isArray(data.planners)){ toast('That file isn’t a Folio backup.'); return; }
  toast('Importing ' + data.planners.length + ' planners…');
  const newAsset = {};
  for (const id in (data.images || {})){
    try{
      const blob = await (await fetch(data.images[id])).blob();
      if (Store.assets){ const up = await Store.assets.upload(blob); newAsset[id] = {asset:up.id}; }
      else { const {canvas} = await shrink(blob, 520, .82); newAsset[id] = {data:canvas.toDataURL('image/webp', .8)}; }
    }catch(e){}
  }
  for (const f of (data.meta && data.meta.folders) || []) if (!folders().some(x => x.id===f.id)) folders().push(f);
  Store.saveMeta();
  for (const p of data.planners){
    if (p.example && [...S.planners.values()].some(x => x.example && x.title===p.title && x.id!==p.id)) continue;   // don't duplicate the sample planners
    for (const pg of p.pages || []) for (const dc of pg.deco || []) if (dc.kind==='image' && dc.asset){
      const n = newAsset[dc.asset]; delete dc.asset; delete dc.data; if (n) Object.assign(dc, n);
    }
    const m = migrate(p); if (!m.look){ m.look = {...(OLD_STYLE_LOOK[m.style || TINT_STYLE[m.tint]] || DEFAULT_LOOK)}; delete m.style; delete m.tint; }
    S.planners.set(m.id, m); Store.savePlanner(m, true);
    for (const pg of m.pages) if (data.ink && data.ink[pg.id]){ S.ink.set(pg.id, data.ink[pg.id]); Store.saveInk(m.id, pg.id, data.ink[pg.id]); }
  }
  render();
  toast('Imported ' + data.planners.length + ' planners.');
}

function emptyBlocks(blocks){

let overlaySurface = null, lastSurface = null;

  const ov = $('#overlay'); if (ov) ov.classList.toggle('live', on);
  const b = $('#drawBtn'); if (b){ b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true':'false'); }
  if (on){ S.selDeco = null; renderDeco(); showInkbar(); lastSurface = overlaySurface; if (!quiet) toast('Draw anywhere on the page. Press Done when you finish.'); }
  else document.querySelector('.inkbar')?.remove();
}
function showInkbar(){
  document.querySelector('.inkbar')?.remove();
  const bar = h('div', {class:'inkbar', role:'toolbar', 'aria-label':'Drawing tools'}, inkTools(true),
    h('button', {class:'tool', type:'button', title:'Clear all drawing on this page', onclick:() => {
      const pg = curPage(), ink = S.ink.get(pg.id); if (!ink || !ink.overlay.length) return;
      const old = ink.overlay.slice(); ink.overlay.length = 0; overlaySurface?.redraw(); saveInk(pg);
      toast('Cleared the drawing on this page.', () => { ink.overlay.push(...old); overlaySurface?.redraw(); saveInk(pg); });
    }}, 'Clear'),
    h('button', {class:'btn primary', type:'button', onclick:() => setDraw(false)}, 'Done'));
  document.body.append(bar);
}

/* ============ Free stickers & washi tape ============ */
function tapeBg(tp){ const c = tp.color; return tp.pattern==='stripes' ? `repeating-linear-gradient(-45deg, ${c} 0 9px, color-mix(in srgb, ${c} 55%, white) 9px 18px)` : tp.pattern==='dots' ? `radial-gradient(circle, rgba(255,255,255,.75) 2.2px, transparent 2.8px) 0 0 / 12px 12px, ${c}` : c; }
function placeDeco(n, d, k){ n.style.left = d.x*k+'px'; n.style.top = d.y*k+'px'; n.style.width = d.w*k+'px'; n.style.height = (d.kind==='tape' ? d.h : d.kind==='image' ? d.w*(d.ar||1) : d.w)*k+'px'; n.style.transform = `rotate(${d.r||0}deg)`; }
function renderDeco(){
  const box = $('#deco'), paper = $('#paper'); if (!box) return;
  box.replaceChildren(); document.querySelector('.dctools')?.remove();
  const pg = curPage(), k = paper.clientWidth / 1000;
  for (const d of pg.deco){
    const n = h('div', {class:'dc'+(S.selDeco===d.id?' sel':''), 'data-id':d.id, role:'img', 'aria-label':d.kind==='tape' ? 'Washi tape' : d.kind==='image' ? 'Picture' : d.name.replace(/-/g,' ')});
    if (d.kind==='sticker') n.append(Stickers.node(d.name));
    else if (d.kind==='image'){ const im = h('img', {class:'pic', alt:'', draggable:'false', src:picSrc(d)}); im.addEventListener('error', () => { im.removeAttribute('src'); im.classList.add('missing'); }); n.append(im); }
    else n.append(h('div', {class:'tape', style:{background:tapeBg(d)}}));
    n.append(h('span', {class:'rz', title:'Drag to resize', 'aria-hidden':'true'}), h('span', {class:'rt', title:'Drag to rotate', 'aria-hidden':'true'}, '↻'));
    placeDeco(n, d, k); box.append(n);
    n.addEventListener('pointerdown', e => {
      if (S.draw || e.button > 0) return;
      e.preventDefault(); e.stopPropagation();
      const kk = paper.clientWidth/1000, resize = !!e.target.closest('.rz'), rotate = !!e.target.closest('.rt'), sx = e.clientX, sy = e.clientY, o = {...d};
      const nr = n.getBoundingClientRect(), cx = nr.left + nr.width/2, cy = nr.top + nr.height/2;
      const a0 = Math.atan2(sy-cy, sx-cx)*180/Math.PI, r0 = d.r||0; let badge = null;
      if (rotate){ n.classList.add('rotating'); badge = h('div', {class:'rotbadge'}, Math.round(r0)+'°'); paper.append(badge); }
      if (S.selDeco !== d.id){ S.selDeco = d.id; box.querySelectorAll('.dc').forEach(x => x.classList.toggle('sel', x===n)); }
      document.querySelector('.dctools')?.remove();
      let moved = false;
      const mv = ev => {
        const dx = (ev.clientX-sx)/kk, dy = (ev.clientY-sy)/kk;
        if (!moved && Math.hypot(dx,dy) < 3) return; moved = true;
        if (rotate){
          let r = r0 + Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI - a0;
          r = ((r % 360) + 540) % 360 - 180;
          if (ev.shiftKey) r = Math.round(r/15)*15;
          else { const near = Math.round(r/45)*45; if (Math.abs(r-near) < 5) r = near; }
          d.r = Math.round(r);
          n.style.transform = `rotate(${d.r}deg)`;
          const pr = paper.getBoundingClientRect(); badge.textContent = d.r+'°'; badge.style.left = (cx - pr.left - 18)+'px'; badge.style.top = (cy - pr.top - 12)+'px';
          return;
        }
        if (resize){
          const rad = (d.r||0)*Math.PI/180, lx = dx*Math.cos(rad) + dy*Math.sin(rad), ly = -dx*Math.sin(rad) + dy*Math.cos(rad);
          d.w = clamp(o.w + (d.kind==='tape' ? lx : (lx+ly)/2), 30, 1000); if (d.kind==='tape') d.h = clamp(o.h+ly, 16, 200);
        }
        else { d.x = clamp(o.x+dx, -d.w/2, 1000-d.w/2); d.y = Math.max(-60, o.y+dy); }
        placeDeco(n, d, kk);
      };
      const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); n.classList.remove('rotating'); badge?.remove(); if (moved) touch(); decoTools(n, d); };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  }
}
function renderDecoPositions(){
  const paper = $('#paper'); if (!paper) return; const k = paper.clientWidth/1000, pg = curPage();
  document.querySelectorAll('#deco .dc').forEach(n => { const d = pg.deco.find(x => x.id===n.dataset.id); if (d) placeDeco(n, d, k); });
}
function decoTools(n, d){
  document.querySelector('.dctools')?.remove();
  const paper = $('#paper'), pg = curPage();
  if (!n || !paper) return;
  const t = h('div', {class:'dctools'},
    (d.r ? h('button', {type:'button', title:'Set rotation back to 0°', onclick:() => { d.r = 0; touch(); renderDeco(); decoTools($(`.dc[data-id="${d.id}"]`), d); }}, 'Straighten') : null),
    h('button', {type:'button', onclick:() => { const c = {...clone(d), id:uid(), x:d.x+30, y:d.y+30}; pg.deco.push(c); S.selDeco = c.id; touch(); renderDeco(); decoTools($(`.dc[data-id="${c.id}"]`), c); }}, 'Copy'),
    h('button', {type:'button', style:{color:'var(--danger)'}, onclick:() => { const i = pg.deco.indexOf(d); pg.deco.splice(i,1); S.selDeco = null; touch(); renderDeco(); toast('Removed.', () => { pg.deco.splice(i,0,d); touch(); renderDeco(); }); }}, 'Delete'));
  paper.append(t);
  const pr = paper.getBoundingClientRect(), r = n.getBoundingClientRect();
  t.style.left = clamp(r.left - pr.left, 8, pr.width - t.offsetWidth - 8)+'px';
  t.style.top = (r.bottom - pr.top + 14)+'px';
}

/* ============ Sticker / tape / icon picker ============ */
function closePicker(){ S.picker = null; document.querySelector('.picker')?.remove(); }
function openPicker(anchor, mode){
  if (S.picker && S.picker.mode===mode){ closePicker(); return; }
  S.picker = {mode, tab:'stickers', q:'', cat:'Popular', limit:120, anchor};
  renderPicker();
  const off = e => { const p = document.querySelector('.picker'); if (!p || (!p.contains(e.target) && !anchor.contains(e.target))){ if (p) closePicker(); document.removeEventListener('pointerdown', off, true); } };
  setTimeout(() => document.addEventListener('pointerdown', off, true));
}
function renderPicker(){
  const st = S.picker; if (!st) return;
  const old = document.querySelector('.picker'); const hadFocus = old && document.activeElement && document.activeElement.id==='pickSearch';
  old?.remove();
  const head = h('div', {class:'picker-head'}), body = h('div', {class:'picker-body'});
  const pk = h('div', {class:'picker', role:'dialog', 'aria-label': st.mode==='icon' ? 'Choose planner icon' : 'Add a sticker'}, head, body);
  if (st.mode==='deco') head.append(h('div', {class:'tabs', role:'tablist'}, [['stickers','Stickers'],['tape','Washi tape'],['pic','Picture']].map(([k,l]) => h('button', {type:'button', role:'tab', 'aria-selected': st.tab===k ? 'true':'false', onclick:() => { st.tab = k; renderPicker(); }}, l))));
  if (st.tab==='pic' && st.mode==='deco'){
    const file = h('input', {type:'file', id:'picFile', accept:'image/png,image/jpeg,image/webp,image/gif', multiple:true, hidden:true});
    file.addEventListener('change', () => { addPictures([...file.files]); file.value = ''; });
    const box = h('div', {class:'upbox'},
      h('div', {style:{fontSize:'30px'}}, '🖼️'),
      h('div', {}, 'Copy any picture (Pinterest, Google, a screenshot) and press ', h('kbd', {}, isMac ? '⌘' : 'Ctrl'), ' + ', h('kbd', {}, 'V'), ' on the page.'),
      h('button', {class:'btn primary', type:'button', onclick:() => file.click()}, 'Choose from device'),
      h('div', {class:'credit'}, 'You can also drag pictures onto the page.'), file);
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('over'); });
    box.addEventListener('dragleave', () => box.classList.remove('over'));
    box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('over'); addPictures([...e.dataTransfer.files]); });
    body.append(box);
  } else if (st.tab==='tape' && st.mode==='deco'){
    body.append(h('div', {class:'tgrid'}, TAPES.map(tp => h('button', {type:'button', 'aria-label':'Add washi tape', onclick:() => addDeco({kind:'tape', ...tp, w:220, h:40, r:Math.round(Math.random()*10-5)})}, h('div', {class:'tape', style:{background:tapeBg(tp)}})))));
  } else {
    const search = h('input', {class:'input', id:'pickSearch', type:'search', placeholder:'Search: cat, coffee, star, gym…', value:st.q, 'aria-label':'Search stickers'});
    const grid = h('div', {class:'sgrid'});
    const more = h('button', {class:'btn', type:'button', style:{marginTop:'10px'}}, 'Show more');
    const chips = h('div', {class:'chips'}, ['Popular', ...(Stickers.data ? Object.keys(Stickers.data.c) : [])].map(c => h('button', {class:'chip', type:'button', 'aria-pressed': st.cat===c ? 'true':'false', onclick:() => { st.cat = c; st.limit = 120; renderPicker(); }}, c)));
    chips.hidden = !!st.q;
    const fill = () => {
      grid.replaceChildren();
      if (!Stickers.data){ grid.append(h('p', {class:'credit', style:{gridColumn:'1/-1'}}, Stickers.failed ? 'Stickers didn’t load. Reload the page to try again.' : 'Loading stickers…')); more.hidden = true; return; }
      const list = Stickers.search(st.q, st.q ? null : st.cat);
      for (const n of list.slice(0, st.limit)) grid.append(h('button', {type:'button', title:n.replace(/-/g,' '), 'aria-label':n.replace(/-/g,' '), onclick:() => {
        if (st.mode==='icon'){ cur().icon = n; touch(); closePicker(); const ib = $('.iconbtn .stk'); if (ib){ ib.dataset.stk = n; Stickers.fill(ib, n); } }
        else addDeco({kind:'sticker', name:n, w:110, r:Math.round(Math.random()*20-10)});
      }}, Stickers.node(n)));
      if (!list.length) grid.append(h('p', {class:'credit', style:{gridColumn:'1/-1'}}, 'No stickers match. Try a simpler word.'));
      more.hidden = list.length <= st.limit;
    };
    search.addEventListener('input', () => { st.q = search.value; st.limit = 120; chips.hidden = !!st.q; fill(); });
    more.addEventListener('click', () => { st.limit += 240; fill(); });
    head.append(search, chips); body.append(grid, more, h('p', {class:'credit', style:{marginTop:'8px'}}, 'Shown in your device’s emoji style.'));
    fill();
    if (hadFocus || matchMedia('(pointer:fine)').matches) setTimeout(() => search.focus(), 0);
  }
  document.body.append(pk);
  const r = st.anchor.getBoundingClientRect();
  pk.style.left = clamp(r.left, 12, innerWidth - pk.offsetWidth - 12)+'px';
  pk.style.top = clamp(r.bottom + 8, 12, innerHeight - pk.offsetHeight - 12)+'px';
}
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
function picSrc(d){ return d.asset ? (Store.assetUrl ? Store.assetUrl(d.asset) : '/_blob/' + d.asset) : (d.data || ''); }
function loadImage(blob){
  return new Promise((res, rej) => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => res({im, u}); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); }; im.src = u; });
}
async function shrink(blob, max, q){
  const {im, u} = await loadImage(blob);
  const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth*sc)), hh = Math.max(1, Math.round(im.naturalHeight*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  c.getContext('2d').drawImage(im, 0, 0, w, hh); URL.revokeObjectURL(u);
  const out = await new Promise(r => c.toBlob(r, 'image/webp', q));
  return {blob: out && out.type==='image/webp' ? out : await new Promise(r => c.toBlob(r, 'image/png')), canvas:c, ar: hh/w};
}
let picBusy = 0;
async function addPictures(files){
  const imgs = files.filter(f => f && /^image\//.test(f.type));
  if (!imgs.length){ toast('That isn’t a picture. Copy an image and try again.'); return; }
  if (S.view!=='ed' || !cur()) return;
  if (!S.editing){ setEditing(true); }
  picBusy++; toast(imgs.length > 1 ? `Adding ${imgs.length} pictures…` : 'Adding picture…');
  let added = 0;
  for (const f of imgs){
    try{
      let d;
      if (Store.assets){
        const {blob, ar} = f.type==='image/gif' ? {blob:f, ar:(await shrink(f, 64, .5)).ar} : await shrink(f, 1400, .9);
        const up = await Store.assets.upload(blob);
        d = {kind:'image', asset:up.id, ar, w:ar > 1.3 ? 200 : 280, r:0};
      } else {
        const {canvas, ar} = await shrink(f, 520, .82);
        const data = canvas.toDataURL('image/webp', .8);
        if (data.length > 90000){ toast('This picture is too big to save here. Try a smaller one.'); continue; }
        d = {kind:'image', data, ar, w:ar > 1.3 ? 200 : 280, r:0};
      }
      addDeco(d); added++;
    }catch(e){
      toast(e && e.code==='quota_or_state' ? 'Picture storage is full. Delete some pictures and try again.' : e && e.code==='too_large' ? 'That picture is too large (20 MB max).' : 'Couldn’t add that picture. Try copying it again.');
    }
  }
  picBusy--; closePicker();
  if (added) toast(added > 1 ? `Added ${added} pictures. Drag to move, ↻ to rotate.` : 'Picture added. Drag to move, ↻ to rotate.');
}
document.addEventListener('paste', e => {
  if (S.view!=='ed' || !e.clipboardData) return;
  const files = [...e.clipboardData.items].filter(it => it.kind==='file' && /^image\//.test(it.type)).map(it => it.getAsFile()).filter(Boolean);
  if (!files.length) return;          // plain text paste works as usual
  e.preventDefault();
  addPictures(files);
});
document.addEventListener('dragover', e => {
  if (S.view!=='ed' || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); $('#paper')?.classList.add('dropping');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('#paper')?.classList.remove('dropping'); });
document.addEventListener('drop', e => {
  $('#paper')?.classList.remove('dropping');
  if (S.view!=='ed' || !e.dataTransfer || !e.dataTransfer.files.length) return;
  if (e.target.closest && e.target.closest('.upbox')) return;
  e.preventDefault(); addPictures([...e.dataTransfer.files]);
});
function addDeco(d){
  const pg = curPage(), paper = $('#paper'), main = $('#main');
  const k = paper.clientWidth/1000, pr = paper.getBoundingClientRect(), mr = main.getBoundingClientRect();
  const visMid = (Math.max(mr.top, pr.top) + Math.min(mr.bottom, pr.bottom))/2 - pr.top;
  const n = pg.deco.length % 5;
  d.id = uid(); d.x = clamp(500 - d.w/2 + n*30 - 60, 0, 1000 - d.w); d.y = Math.max(0, visMid/k - (d.h || d.w*(d.ar||1))/2 + n*20);
  pg.deco.push(d); S.selDeco = d.id; touch(); renderDeco();
  if (!matchMedia('(pointer:fine)').matches) closePicker();
  const node = $(`.dc[data-id="${d.id}"]`); if (node) decoTools(node, d);
}

/* ============ Boot ============ */
function seedExamples(){
  for (const id of ['training','weekly','food','sketch']){
    const p = instantiate(TEMPLATES.find(t => t.id===id)); p.example = true; p.updatedAt = Date.now() - Math.random()*3e5;
    S.planners.set(p.id, p); Store.savePlanner(p, true);
  }
}
(async function boot(){
  Stickers.load();
  await Store.init();
  const {meta, planners} = await Store.load();
  if (meta && Array.isArray(meta.folders)){
    S.meta = meta;
    S.meta.folders = S.meta.folders.map((f, i) => ({id:f.id, name:f.name, color: f.color || (DEFAULT_FOLDERS.find(d => d.id===f.id)||{}).color || FOLDER_COLORS[(i+4) % FOLDER_COLORS.length].c}));
    const oldExamples = [];
    for (const p of planners) if (p && p.id && p.pages){
      if (p.v !== 2 && p.example){ oldExamples.push(p); continue; }   // the old sample planners are replaced by new ones
      const m = migrate(p); let changed = m !== p; if (!m.look){ m.look = {...(OLD_STYLE_LOOK[m.style || TINT_STYLE[m.tint]] || DEFAULT_LOOK)}; delete m.style; delete m.tint; changed = true; } S.planners.set(m.id, m); if (changed) Store.savePlanner(m, true);
    }
    oldExamples.forEach(p => Store.deletePlanner(p));
    if (S.meta.v !== 2){ S.meta.v = 2; seedExamples(); Store.saveMeta(); }
  } else {
    S.meta = {folders:clone(DEFAULT_FOLDERS), v:2};
    for (const p of planners) if (p && p.id && p.pages){ const m = migrate(p); S.planners.set(m.id, m); Store.savePlanner(m, true); }
    seedExamples(); Store.saveMeta();
  }
  S.status = 'saved';
  render();
})();
</script>
